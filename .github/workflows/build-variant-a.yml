name: Build kiev Variant A
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build_variant_a.sh'
      - 'scripts/apply_tactile_reference.sh'
      - 'scripts/build.sh'
      - 'scripts/prepare.sh'
      - 'scripts/package_bootimg.py'
      - 'integration/**'
      - '.github/workflows/build-variant-a.yml'
permissions:
  contents: read
env:
  JOBS: '2'
  SOURCE_COMMIT: a49e18994c494d71647f675df48e5c7349580747
  RESUKISU_COMMIT: 90b4a4c70f70c835b01c2be6deac58ee3c0cb4c2
  BOOT_IMAGE_URL: https://mirrorbits.lineageos.org/full/kiev/20260920/boot.img
  BOOT_IMAGE_SHA256: f7938eb61b59df097d1720dc20495db9ad663a3491f94fb3759b1106a5579c3e
  DTBO_IMAGE_URL: https://mirrorbits.lineageos.org/full/kiev/20260920/dtbo.img
  DTBO_IMAGE_SHA256: 323789569f56ba30d00f1372e6f4965702a5a294c7253a81a9ff7f0a7e984e1c
  MAGISKBOOT_APK_URL: https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk
  MAGISKBOOT_APK_SHA256: f511bd33d3242911d05b0939f910a3133ef2ba0e0ff1e098128f9f3cd0c16610
  MAGISKBOOT_SHA256: b5e3c57d26735efb4e37a058cf21e6b8c1db2cb1c832a7b1da0989cceb22cabe
jobs:
  variant-a:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout kit
        uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential cpio curl flex file gcc-aarch64-linux-gnu libelf-dev libssl-dev pahole perl python3 rsync unzip
      - name: Build and package Variant A
        env:
          ROOT: ${{ github.workspace }}/work-variant-a
        run: |
          chmod +x scripts/build_variant_a.sh
          scripts/build_variant_a.sh
      - name: Validate boot image
        run: |
          test -f work-variant-a/artifacts/boot-unsigned.img
          test "$(stat -c '%s' work-variant-a/artifacts/boot-unsigned.img)" -eq 100663296
          sha256sum work-variant-a/artifacts/boot-unsigned.img
      - name: Upload boot-unsigned.img only
        uses: actions/upload-artifact@v4
        with:
          name: kiev-variant-a-boot-unsigned
          path: work-variant-a/artifacts/boot-unsigned.img
          if-no-files-found: error
          retention-days: 14

name: Build kiev ReSukiSU manual-hooks kernel

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-kiev-kernel.yml'
      - 'integration/**'
      - 'scripts/**'
      - 'README.md'

permissions:
  contents: read

env:
  ROOT: ${{ github.workspace }}/work
  KERNEL_DIR: ${{ github.workspace }}/work/kernel
  SOURCE_URL: https://github.com/Albanel22/android_kernel_motorola_sm8250
  SOURCE_COMMIT: a49e18994c494d71647f675df48e5c7349580747
  RESUKISU_URL: https://github.com/ReSukiSU/ReSukiSU.git
  RESUKISU_COMMIT: 0e4698951b8e0e1cb997e46f2049c691869a4f45
  JOBS: '2'
  MKBOOTIMG_COMMIT: 40a19c4c5ffe8b86c6c61318c8aa4ffe35d6e7ad
  BOOT_IMAGE_URL: https://mirrorbits.lineageos.org/full/kiev/20260920/boot.img
  BOOT_IMAGE_SHA256: f7938eb61b59df097d1720dc20495db9ad663a3491f94fb3759b1106a5579c3e
  DTBO_IMAGE_URL: https://mirrorbits.lineageos.org/full/kiev/20260920/dtbo.img
  DTBO_IMAGE_SHA256: 323789569f56ba30d00f1372e6f4965702a5a294c7253a81a9ff7f0a7e984e1c

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout kit
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential cpio curl flex file \
            gcc-aarch64-linux-gnu libelf-dev libssl-dev pahole perl python3 rsync

      - name: Fetch pinned tactile fork kernel
        run: |
          set -Eeuo pipefail
          mkdir -p "$ROOT"
          git clone --filter=blob:none --no-checkout "$SOURCE_URL" "$KERNEL_DIR"
          git -C "$KERNEL_DIR" fetch --depth=1 origin "$SOURCE_COMMIT"
          git -C "$KERNEL_DIR" checkout --detach "$SOURCE_COMMIT"
          test "$(git -C "$KERNEL_DIR" rev-parse HEAD)" = "$SOURCE_COMMIT"

      - name: Prepare pinned ReSukiSU manual-hooks integration
        run: |
          set -Eeuo pipefail
          ROOT="$ROOT" KERNEL_DIR="$KERNEL_DIR" BUNDLE_DIR="$GITHUB_WORKSPACE" \
            SOURCE_COMMIT="$SOURCE_COMMIT" RESUKISU_URL="$RESUKISU_URL" \
            RESUKISU_COMMIT="$RESUKISU_COMMIT" bash scripts/prepare.sh

      - name: Configure and compile raw Image plus modules
        run: |
          set -Eeuo pipefail
          ROOT="$ROOT" KERNEL_DIR="$KERNEL_DIR" JOBS="$JOBS" \
            bash scripts/build.sh

      - name: Validate raw kernel artifact
        run: |
          set -Eeuo pipefail
          KERNEL="$KERNEL_DIR/out/arch/arm64/boot/Image"
          test -s "$KERNEL"
          file "$KERNEL" | grep -q 'Linux kernel ARM64 boot executable Image'
          test "$(find "$KERNEL_DIR/out" -type f -name '*.ko' | wc -l)" -gt 0
          test ! -e "$KERNEL_DIR/fs/Makefile.rej"

      - name: Download official boot and dtbo inputs
        run: |
          set -Eeuo pipefail
          mkdir -p "$ROOT/boot-tools" "$ROOT/boot-input" "$ROOT/artifacts"
          curl --fail --location --retry 3 "$BOOT_IMAGE_URL" -o "$ROOT/boot-input/reference-boot.img"
          printf '%s  %s\n' "$BOOT_IMAGE_SHA256" "$ROOT/boot-input/reference-boot.img" | sha256sum -c -
          curl --fail --location --retry 3 "$DTBO_IMAGE_URL" -o "$ROOT/boot-input/dtbo.img"
          printf '%s  %s\n' "$DTBO_IMAGE_SHA256" "$ROOT/boot-input/dtbo.img" | sha256sum -c -
          curl --fail --location --retry 3 -o "$ROOT/boot-tools/unpack_bootimg.py" \
            "https://raw.githubusercontent.com/LineageOS/android_system_tools_mkbootimg/$MKBOOTIMG_COMMIT/unpack_bootimg.py"
          curl --fail --location --retry 3 -o "$ROOT/boot-tools/mkbootimg.py" \
            "https://raw.githubusercontent.com/LineageOS/android_system_tools_mkbootimg/$MKBOOTIMG_COMMIT/mkbootimg.py"
          mkdir -p "$ROOT/boot-tools/gki"
          curl --fail --location --retry 3 -o "$ROOT/boot-tools/gki/generate_gki_certificate.py" \
            "https://raw.githubusercontent.com/LineageOS/android_system_tools_mkbootimg/$MKBOOTIMG_COMMIT/gki/generate_gki_certificate.py"
          printf '%s  %s\n' \
            '021f2d960b2d3158a9df2ff6255f1140cebb09bc09f4886373438f2919559cd9' "$ROOT/boot-tools/mkbootimg.py" \
            '50ef727dc41402430cf68933eaf5b7c7c71d91d2cc3cf908b2ea8e6e1faa4595' "$ROOT/boot-tools/unpack_bootimg.py" | sha256sum -c -

      - name: Build unsigned boot.img
        run: |
          set -Eeuo pipefail
          python3 scripts/package_bootimg.py \
            --reference "$ROOT/boot-input/reference-boot.img" \
            --kernel "$KERNEL_DIR/out/arch/arm64/boot/Image" \
            --unpack-tool "$ROOT/boot-tools/unpack_bootimg.py" \
            --mkbootimg-tool "$ROOT/boot-tools/mkbootimg.py" \
            --expected-reference-sha256 "$BOOT_IMAGE_SHA256" \
            --output "$ROOT/artifacts/boot-unsigned.img"
          cp "$ROOT/boot-input/dtbo.img" "$ROOT/artifacts/dtbo.img"
          test -s "$ROOT/artifacts/boot-unsigned.img"
          test -s "$ROOT/artifacts/dtbo.img"

      - name: Package reproducible manual-hooks build artifacts
        run: |
          set -Eeuo pipefail
          cp "$KERNEL_DIR/out/arch/arm64/boot/Image" "$ROOT/artifacts/Image"
          cp "$KERNEL_DIR/out/.config" "$ROOT/artifacts/kernel.config"
          cp "$KERNEL_DIR/out/KERNELRELEASE" "$ROOT/artifacts/KERNELRELEASE"
          find "$KERNEL_DIR/out" -type f -name '*.ko' -print0 | \
            tar --null -T - -czf "$ROOT/artifacts/modules.tar.gz"
          sha256sum "$ROOT/artifacts"/* | tee "$ROOT/artifacts/SHA256SUMS"

      - name: Upload manual-hooks build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kiev-resukisu-manual-hooks-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 14
          path: |
            work/artifacts/boot-unsigned.img
            work/artifacts/dtbo.img
            work/artifacts/Image
            work/artifacts/kernel.config
            work/artifacts/KERNELRELEASE
            work/artifacts/modules.tar.gz
            work/artifacts/SHA256SUMS
            work/build.log
